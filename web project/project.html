<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KickNear Site</title>
    <link rel="stylesheet" href="project.css">
</head>
<body>
    <header class="site-header">
        <h1 class="tittle">Kick Near</h1>
        <div class="social-links" role="navigation" aria-label="Contact links">
            <a class="social-link insta" href="https://www.instagram.com/dvmnbodi/" aria-label="Instagram">
                <img class="social-logo" src="https://img.icons8.com/?size=100&id=RhYNENh5cxlS&format=png&color=000000" alt="Instagram logo">
            </a>
            <a class="social-link face" href="https://www.facebook.com/abdelrahman.elmahdy.902/" aria-label="Facebook">
                <img class="social-logo" src="https://img.icons8.com/?size=100&id=kQzCK4emnaD2&format=png&color=000000" alt="Facebook logo">
            </a>
            <a class="social-link call" href="tel:+201026411847" aria-label="Call">
                <img class="social-logo" src="https://img.icons8.com/?size=100&id=AJOqyBhNnjEu&format=png&color=000000" alt="Phone logo">
            </a>
        </div>
    </header>

    <main class="page">
        <section class="container" aria-labelledby="match-form-title">
            <form id="match-form" novalidate>
                <h2 id="match-form-title">Create or Join Match</h2>

                <div class="field">
                    <label for="match-name">Match Name</label>
                    <input id="match-name" type="text" placeholder="Enter Match Name" required>
                </div>

                <div class="field">
                    <label for="team-name">Your Team Name</label>
                    <input id="team-name" type="text" placeholder="Enter Your Team Name" required>
                </div>

                <div class="field">
                    <label for="location">Match Location</label>
                    <input id="location" type="text" placeholder="Enter Match Location" required>
                </div>

                <div class="field">
                    <label for="match-time">Match Date &amp; Time</label>
                    <input id="match-time" type="datetime-local" required>
                </div>

                <div class="field">
                    <label for="players">Number of Players</label>
                    <input id="players" type="number" placeholder="Enter Number of Players" min="1" required>
                </div>

                <div class="field">
                    <label for="phone">Your Phone Number</label>
                    <input id="phone" type="tel" placeholder="Enter Your Phone Number" required>
                </div>

                <div class="field">
                    <label for="existing-matches">Join an Existing Match</label>
                    <select id="existing-matches">
                        <option value="">-- Select Match to Join --</option>
                    </select>
                </div>

                <button type="button" id="join-btn" class="btn btn-secondary">Join Selected Match</button>
                <button type="button" id="submit-btn" class="btn btn-primary">Create Match</button>
            </form>
        </section>

        <section class="matches-section" aria-labelledby="matches-title">
            <h2 id="matches-title">Upcoming Matches</h2>
            <div id="matches-list"></div>
        </section>
    </main>

    <script src="project.js"></script>
</body>
</html>
